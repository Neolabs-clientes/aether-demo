<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  html,body{background:#07060a;color:#ece4d4;margin:0;overflow:hidden}
  #hero{position:relative;height:100vh;overflow:hidden}
  .hero-photo{position:absolute;inset:0;z-index:0}
  .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:70% 50%}
  .hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,6,10,.94) 12%,rgba(7,6,10,.55) 42%,rgba(7,6,10,.12) 68%),linear-gradient(to top,rgba(7,6,10,.9) 0%,transparent 30%)}
  #hero .inner{position:relative;z-index:2;padding:20vh 6vw;max-width:44rem}
  h1{font-family:'Cormorant Garamond',serif;font-size:6rem;font-weight:300;margin:0}
</style>
</head>
<body>
<section id="hero">
  <div class="hero-photo"><img src="assets/hero.jpg"></div>
  <div class="inner"><div style="font-family:'Jost';font-size:.64rem;letter-spacing:.55em;color:#d4af37">Maison de Parfum — Paris</div>
  <h1>AETHER</h1></div>
</section>
<script type="importmap">
{"imports":{
  "three":"vendor/three.module.js",
  "three/addons/":"vendor/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ============ datos ============ */
const FRAGS = [
  {name:'Noir Absolu',  notes:'<b>Oud noir</b> · smoked cedar · <b>leather</b>',          price:'340 € — 100 ml · Extrait de Parfum', glow:'#5b3a8a'},
  {name:'Ambre Rouge',  notes:'<b>Amber</b> · saffron · <b>blood orange</b>',            price:'320 € — 100 ml · Extrait de Parfum', glow:'#b33a2a'},
  {name:'Émeraude',     notes:'<b>Vetiver</b> · moss · <b>green mandarin</b>',           price:'320 € — 100 ml · Extrait de Parfum', glow:'#1f7a4d'},
  {name:'Azur',         notes:'<b>Sea salt</b> · driftwood · <b>bergamot</b>',           price:'360 € — 100 ml · Extrait de Parfum', glow:'#1a5fa8'}
];

/* ============ renderer (solo particulas: nítido, sin luces que quemen) ============ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 40);
camera.position.set(0, 0, 6.4);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.78));
composer.addPass(new OutputPass());

/* ============ partículas de oro ============ */
const PCOUNT = 1300;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PCOUNT*3);
const pBase = new Float32Array(PCOUNT*3);
const pSeed = new Float32Array(PCOUNT);
for(let i=0;i<PCOUNT;i++){
  pSeed[i] = Math.random()*Math.PI*2;
  const r = 1.2 + Math.random()*2.6;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  pBase[i*3]   = r*Math.sin(ph)*Math.cos(th);
  pBase[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.85;
  pBase[i*3+2] = r*Math.cos(ph)*0.6;
  pPos[i*3]   = pBase[i*3]; pPos[i*3+1] = pBase[i*3+1]; pPos[i*3+2] = pBase[i*3+2];
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color:0xd4af37, size:0.022, transparent:true, opacity:0,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
});
const points = new THREE.Points(pGeo, pMat);
scene.add(points);

/* ============ estados partículas ============ */
const DRIFT=0, SURGE=1;
let pMode = DRIFT;
const state = {swirl:0};
function setMode(m){ pMode = m; }

/* ============ scroll: parallax foto hero + surgimiento en craft ============ */
gsap.to('.hero-photo', {yPercent:14, ease:'none',
  scrollTrigger:{trigger:'#hero', start:'top top', end:'bottom top', scrub:1}
});
gsap.to('#hero .inner', {
  yPercent:-24, opacity:0.25, ease:'none',
  scrollTrigger:{trigger:'#hero', start:'top top', end:'bottom top', scrub:1}
});
let surged = false;
ScrollTrigger.create({
  trigger:'#craft', start:'top 60%',
  onEnter(){ if(!surged){ surged = true; gsap.to(pMat, {opacity:0.85, duration:1.2}); gsap.to(state, {swirl:1, duration:1.4}); } },
  onLeaveBack(){ if(surged){ surged = false; gsap.to(pMat, {opacity:0.12, duration:1}); gsap.to(state, {swirl:0, duration:1.4}); } }
});

/* ============ fragancias ============ */
const swatches = [...document.querySelectorAll('.swatch')];
const stageImgs = [...document.querySelectorAll('.stage img')];
const fragName = document.getElementById('frag-name');
const fragNotes = document.getElementById('frag-notes');
const fragPrice = document.getElementById('frag-price');
const stage = document.getElementById('stage');
const stageGlow = document.getElementById('stage-glow');
let curFrag = 0;
function selectFrag(i){
  if(i===curFrag) return; curFrag = i;
  swatches.forEach((s,idx)=>s.classList.toggle('active', idx===i));
  stageImgs.forEach((im,idx)=>im.classList.toggle('active', idx===i));
  const f = FRAGS[i];
  stageGlow.style.setProperty('--fg', f.glow);
  gsap.fromTo(stageGlow, {opacity:0.15}, {opacity:0.55, duration:0.8, ease:'power2.out'});
  gsap.fromTo(fragName, {opacity:0, y:14}, {opacity:1, y:0, duration:0.5, ease:'power2.out'});
  gsap.fromTo(fragNotes, {opacity:0, y:10}, {opacity:1, y:0, duration:0.5, delay:0.08, ease:'power2.out'});
  gsap.fromTo(fragPrice, {opacity:0, y:10}, {opacity:1, y:0, duration:0.5, delay:0.16, ease:'power2.out'});
  gsap.fromTo(stage, {scale:1.025}, {scale:1, duration:0.7, ease:'power2.out'});
  fragName.textContent = f.name;
  fragNotes.innerHTML = f.notes;
  fragPrice.textContent = f.price;
}
swatches.forEach((s,i)=>s.addEventListener('click', ()=>selectFrag(i)));
const qp = new URLSearchParams(location.search).get('frag');
if(qp!==null && FRAGS[qp]) selectFrag(+qp);
const qs = new URLSearchParams(location.search).get('sec');
if(qs){ setTimeout(()=>{ const el = document.getElementById(qs); if(el) el.scrollIntoView({behavior:'instant'}); }, 4200); }

/* ============ loop ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const arr = pGeo.attributes.position.array;
  const sw = state.swirl;
  for(let i=0;i<PCOUNT;i++){
    const s = pSeed[i];
    // deriva orgánica + swirl al llegar a craft
    const swirlX = Math.cos(t*0.5 + s)*1.1*sw;
    const swirlY = Math.sin(t*0.45 + s*1.7)*0.9*sw;
    const tx = pBase[i*3]   + swirlX;
    const ty = pBase[i*3+1] + swirlY;
    const tz = pBase[i*3+2] + Math.sin(t*0.3 + s*2.3)*0.35;
    arr[i*3]   += (tx - arr[i*3])*0.03;
    arr[i*3+1] += (ty - arr[i*3+1])*0.03;
    arr[i*3+2] += (tz - arr[i*3+2])*0.03;
    if(!sw){ arr[i*3+1] += Math.sin(t*0.7+s)*0.0007; }
  }
  pGeo.attributes.position.needsUpdate = true;
  points.rotation.y = t*0.02;
  composer.render();
}
animate();

/* ============ resize ============ */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ============ cursor + magnet ============ */
const dot = document.getElementById('cur-dot'), ring = document.getElementById('cur-ring');
let mx=0, my=0, rx=0, ry=0;
addEventListener('pointermove', e=>{ mx=e.clientX; my=e.clientY; });
(function curLoop(){
  rx+=(mx-rx)*0.16; ry+=(my-ry)*0.16;
  dot.style.transform = `translate(${mx-2.5}px,${my-2.5}px)`;
  ring.style.transform = `translate(${rx-17}px,${ry-17}px)`;
  requestAnimationFrame(curLoop);
})();
document.querySelectorAll('a,button,.swatch').forEach(el=>{
  el.addEventListener('pointerenter', ()=>ring.classList.add('on'));
  el.addEventListener('pointerleave', ()=>ring.classList.remove('on'));
});
document.querySelectorAll('[data-magnet]').forEach(el=>{
  el.addEventListener('pointermove', e=>{
    const r = el.getBoundingClientRect();
    el.style.transform = `translate(${(e.clientX-r.left-r.width/2)*0.22}px,${(e.clientY-r.top-r.height/2)*0.22}px)`;
  });
  el.addEventListener('pointerleave', ()=>el.style.transform = '');
});

/* ============ particulas aparecen cuando termina el preloader (mejora no critica) ============ */
function sparkle(){ gsap.to(pMat, {opacity:0.12, duration:1.4}); }
if(window.__aetherReady) sparkle(); else document.addEventListener('aether-ready', sparkle, {once:true});

/* reveals por seccion */
function splitWords(el){
  const words = el.textContent.trim().split(/\s+/);
  el.innerHTML = words.map(w=>`<span class="word"><span>${w}</span></span>`).join(' ');
}
document.querySelectorAll('#collection h2, #craft h2, #manifesto h2').forEach(splitWords);
gsap.utils.toArray('#collection, #craft, #manifesto').forEach(sec=>{
  ScrollTrigger.create({trigger:sec, start:'top 70%', once:true, onEnter:()=>sec.classList.add('in')});
});
</script>
</body>
</html>
