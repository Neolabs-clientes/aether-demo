<!DOCTYPE html><html><head><style>
html,body{background:#07060a;margin:0}
#preloader{position:fixed;inset:0;z-index:100;background:#07060a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2rem;
  animation:plhide 2.8s ease 1.9s forwards}
@keyframes plhide{to{opacity:0;visibility:hidden;pointer-events:none}}
.pl-name{color:#ece4d4;font-size:5rem;font-family:serif}
.pl-count{color:#d4af37;position:absolute;bottom:2rem;right:3rem}
.pl-line{position:absolute;bottom:3rem;left:3rem;width:120px;height:1px;background:rgba(212,175,55,.35);overflow:hidden}
.pl-line i{display:block;width:100%;height:100%;background:#d4af37;transform:scaleX(0);transform-origin:left}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="preloader">
  <div class="pl-name">AETHER</div>
  <div class="pl-count">0</div>
  <div class="pl-line"><i></i></div>
</div>
<div style="position:fixed;inset:0;background:#0a6e2a;z-index:0"></div>
<script>
/* preloader independiente: no depende de WebGL ni de gsap. Si el 3D falla, la web sigue visible. */
(function(){
  var count = 0, el = document.querySelector('.pl-count'), bar = document.querySelector('.pl-line i');
  var iv = setInterval(function(){
    count += 1 + Math.floor(Math.random()*7);
    if(count >= 100){ count = 100; clearInterval(iv); }
    el.textContent = count;
    if(bar) bar.style.transform = 'scaleX(' + (count/100) + ')';
    if(count === 100) setTimeout(finish, 250);
  }, 60);
  function finish(){
    var pl = document.getElementById('preloader');
    var name = document.querySelector('.pl-name'), sub = document.querySelector('.pl-sub');
    if(name){ name.style.transition = 'transform .6s, opacity .6s'; name.style.transform = 'translateY(-26px)'; name.style.opacity = 0; }
    if(sub){ sub.style.transition = 'transform .6s, opacity .6s'; sub.style.transform = 'translateY(-26px)'; sub.style.opacity = 0; }
    if(el){ el.style.transition = 'opacity .4s'; el.style.opacity = 0; }
    if(pl){ pl.style.transition = 'transform 1.05s cubic-bezier(.16,1,.3,1) .35s'; pl.style.transform = 'translateY(-101%)'; setTimeout(function(){ pl.style.display = 'none'; }, 1500); }
    /* revelar foto y titulo hero: critico, no depende del modulo WebGL */
    var hp = document.querySelector('.hero-photo img'); if(hp){ setTimeout(function(){ hp.classList.add('on'); }, 500); }
    var h1 = document.querySelector('#hero h1'); if(h1){ setTimeout(function(){ h1.classList.add('in'); }, 700); }
    window.__aetherReady = true;
    document.dispatchEvent(new CustomEvent('aether-ready'));
  }
  window.addEventListener('error', function(e){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;bottom:8px;left:8px;z-index:9999;color:#f66;background:#000;font:11px monospace;padding:4px 8px;max-width:90vw';
    d.textContent = 'ERR: ' + (e.message || e.type);
    document.body.appendChild(d);
  });
})();

</script>
</body></html>
